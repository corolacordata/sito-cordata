<main id="app"><noscript><p>Coro &quot;La Cordata&quot; APS · Sede Legale: Via Episcopio 16, 63068 Montalto delle Marche (AP) · info@corolacordata.org</p><p>Nel 1984, durante un'escursione al monastero di S. Leonardo, sopra le gole dell'Infernaccio sui Monti Sibillini, un piccolo gruppo di ragazzi improvvisò a quattro voci il &quot;Signore delle Cime&quot;, suscitando in Padre Pietro Armando Lavini, ammirazione e incoraggiamento a proseguire. Tre anni più tardi quel piccolo coro che cantava con tanto entusiasmo, con l'aiuto di altri amici divenne &quot;La Cordata&quot;, una formazione maschile, composta da 32 elementi, che attraverso lo studio del canto della montagna, alpino e popolare, si ritrovano per la gioia di cantare insieme. Nasce il 29 maggio 1987 a Montalto Marche, un centro ricco di storia e tradizioni musicali, situato sulle verdi colline dell'entroterra marchigiano, poco distante dalla catena dei monti Sibillini. Si propone di migliorare la propria vocalità, mantenendo inalterato il modo semplice di cantare tipico della canzone popolare. Maturando progressivamente la preparazione musicale, partecipa ad oltre 370 importanti concerti e rassegne corali in varie città italiane e straniere, riscuotendo ovunque unanimi consensi di pubblico e di critica, con giudizi positivi di commissioni d'ascolto e illustri personaggi della coralità italiana. Il coro ha cantato in sale prestigiose come l'Aula Magna del Conservatorio G. Verdi di Torino, il Teatro Ventidio Basso di Ascoli Piceno, il Teatro Lauro Rossi di Macerata, la Cattedrale di Bobbio, il Teatro Pergolesi di Jesi, la Cattedrale di Budapest, il Castello della Rancia di Tolentino, l'Abbazia di S. Emiliano in Congiuntoli di Scheggia, la Basilica Inferiore di San Francesco d'Assisi, il Teatro Giuseppe Verdi di Pordenone, il Chiostro del Conservatorio di Teramo, l'Abbazia di S. Elena di Serra S. Quirico, la Sala del Tricolore e l'Aula Magna dell'Università di Reggio Emilia. Nel 1992 gli è stato conferito il Premio ARCOM (Ass. Reg. Cori Marchigiani), quale giovane coro distintosi per impegno continuo e crescita musicale costante. Ha partecipato inoltre a trasmissioni radiofoniche e televisive, come &quot;Andar per Cori&quot; dalla sede regionale RAI - Ancona e &quot;Utile e futile&quot; in diretta su RAIUNO. Dal 1988 organizza nel proprio paese il Festival degli Appennini, ospitando il meglio della coralità popolare.</p></noscript></main>
